<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grammar Check! 🌸</title>
<style>
:root{--ink:#4a3f6b;--pk:#ffd6e7;--lv:#e4d9ff;--mt:#d3f5e6;--pc:#ffe6d1;--sk:#d6ecff;--ok:#2e9e6b;--no:#d9486b}
*{box-sizing:border-box}
body{margin:0;font-family:"Fredoka One","Baloo 2",Nunito,"Segoe UI",Tahoma,sans-serif;color:var(--ink);background:linear-gradient(160deg,#fff4fa,#f1ecff 55%,#eafaf3);min-height:100vh;font-size:18px}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:12px;align-items:center;padding:10px 16px;background:#fffffff0;border-bottom:3px solid var(--lv);font-weight:700}
.pb{flex:1;height:14px;background:var(--lv);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9ec7,#a98bff);transition:width .4s}
header{text-align:center;padding:22px 14px 6px}
h1{margin:0;font-size:clamp(28px,6vw,44px)}
.cr{margin:4px 0 12px;font-size:15px;opacity:.8}
.who{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:820px;margin:0 auto 6px;padding:0 12px}
.who label{flex:1 1 200px;font-size:15px}
.who input{width:100%;border:2px dashed #c9b8ff;border-radius:12px;padding:8px 10px;font:inherit;background:#fff}
main{max-width:820px;margin:0 auto;padding:10px 12px 40px}
section{border-radius:26px;padding:16px 16px 8px;margin:18px 0}
section h2{margin:0;font-size:24px}.ar{direction:rtl;margin:2px 0 12px;font-size:16px;opacity:.85}
.card{background:#fff;border-radius:18px;padding:14px;margin:0 0 14px;border:3px solid transparent;box-shadow:0 2px 0 #00000012}
.card.ok{border-color:var(--ok)}.card.no{border-color:var(--no)}
.q{margin:0 0 10px;line-height:1.5}
.o{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;color:var(--ink);cursor:pointer}
.o button,.chk{border:2px solid #cdbdff;background:var(--lv);border-radius:14px;padding:9px 14px;font-size:17px}
.o button:hover:not(:disabled),.chk:hover{background:#d3c2ff}
.o button.right{background:var(--mt);border-color:var(--ok)}.o button.wrong{background:#ffd9e2;border-color:var(--no)}
.o button:disabled{cursor:default}
input.t{border:2px solid #cdbdff;border-radius:12px;padding:9px 12px;font:inherit;width:100%;max-width:440px;margin-right:8px}
.fb{min-height:22px;margin:8px 0 0;font-size:16px;font-weight:700}
.ans,.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:8px;border-radius:14px}
.ans{background:var(--sk);margin-bottom:8px;border:2px dashed #8fc3f0}
.w{border:0;background:var(--pc);border-radius:12px;padding:8px 12px;font-size:17px;box-shadow:0 2px 0 #e8c3a3}
.rst{background:none;border:0;text-decoration:underline;font-size:15px}
#res{max-width:560px;margin:10px auto 40px;background:#fff;border-radius:28px;padding:26px;text-align:center;border:4px solid var(--lv)}
#res h2{font-size:34px;margin:0 0 6px}.big{font-size:56px;margin:6px 0}
.re{background:linear-gradient(90deg,#ff9ec7,#a98bff);color:#fff;border:0;border-radius:16px;padding:12px 24px;font-size:19px;margin-top:10px}
footer{text-align:center;padding:16px;font-size:15px;opacity:.75}
.rain{position:fixed;top:-40px;font-size:28px;pointer-events:none;animation:f 3.2s linear forwards}
@keyframes f{to{transform:translateY(110vh) rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.rain{display:none}.pb i{transition:none}}
:focus-visible{outline:3px solid #7a5cff;outline-offset:2px}
</style></head><body>
<div class="bar"><span id="sc">⭐ 0</span><div class="pb"><i id="pf"></i></div><span id="pg">0/0</span></div>
<header><h1>🌸 Grammar Check! 🌸</h1>
<p class="cr">Present Continuous for Future Arrangements + -ed / -ing Adjectives<br>Created by T. Badria Alfalahi</p>
<div class="who"><label>Name<input id="nm"></label><label>Class<input id="cl"></label><label>Date<input id="dt"></label></div></header>
<main id="m"></main>
<div id="res" hidden></div>
<footer>Created by T. Badria Alfalahi ✨</footer>
<script>
var S=[
{t:"Part 1: Present Continuous for Future Arrangements ✈️",ar:"اختاري الإجابة الصحيحة",c:"var(--pk)",i:[
{k:"mc",q:"Look at your schedule! We ___ an English test next Monday.",o:["is having","are having","am having"],a:1},
{k:"mc",q:"My family and I ___ to Dubai tomorrow evening.",o:["am traveling","is traveling","are traveling"],a:2},
{k:"mc",q:"No, thank you! She ___ with us to the party tonight.",o:["isn't coming","aren't coming","am not coming"],a:0},
{k:"mc",q:"What ___ this weekend?",o:["are you doing","is you doing","am you doing"],a:0}]},
{t:"Part 2: Adjectives (-ed / -ing) 🎨",ar:"اختاري الصفة الصحيحة",c:"var(--lv)",i:[
{k:"mc",q:"The horror movie was so frightening! We were really ___.",o:["frightened","frightening"],a:0},
{k:"mc",q:"Are you ___ in reading science books?",o:["interested","interesting"],a:0},
{k:"mc",q:"The long lecture was very ___. Everyone fell asleep!",o:["bored","boring"],a:1},
{k:"mc",q:"Sarah received a wonderful gift today. She was so ___!",o:["surprised","surprising"],a:0}]},
{t:"Part 3: Challenge Zone! 🧩",ar:"اكتبي أو اختاري الإجابة الصحيحة",c:"var(--mt)",i:[
{k:"fill",q:"My friends ______ (come) to my house for dinner tonight.",a:["are coming"],h:"Use present continuous: are + verb-ing"},
{k:"mc",q:"The roller coaster ride is so ___! I love it!",o:["excited","exciting"],a:1}]},
{t:"Part 4: Feeling or Thing? 😊🎬",ar:"هل الكلمة تصف شعورًا (-ed) أم الشيء المسبب للشعور (-ing)؟",c:"var(--pc)",i:[
{k:"mc",q:"excited",o:["😊 Feeling (-ed)","🎬 Thing (-ing)"],a:0},
{k:"mc",q:"confusing",o:["😊 Feeling (-ed)","🎬 Thing (-ing)"],a:1},
{k:"mc",q:"amazed",o:["😊 Feeling (-ed)","🎬 Thing (-ing)"],a:0},
{k:"mc",q:"terrifying",o:["😊 Feeling (-ed)","🎬 Thing (-ing)"],a:1},
{k:"mc",q:"tired",o:["😊 Feeling (-ed)","🎬 Thing (-ing)"],a:0},
{k:"mc",q:"relaxing",o:["😊 Feeling (-ed)","🎬 Thing (-ing)"],a:1}]},
{t:"Part 5: True or False? ✅❌",ar:"صح أم خطأ؟",c:"var(--sk)",i:[
{k:"mc",q:"“I am bored” tells how I feel.",o:["True","False"],a:0},
{k:"mc",q:"“The movie was very interested.” is correct.",o:["True","False"],a:1},
{k:"mc",q:"“She is meeting her friends tomorrow.” talks about a future arrangement.",o:["True","False"],a:0},
{k:"mc",q:"“They is visiting Grandma on Friday.” is correct.",o:["True","False"],a:1}]},
{t:"Part 6: Build the Sentence 🧱",ar:"رتبي الكلمات لتكوين جملة صحيحة",c:"var(--pk)",i:[
{k:"ord",w:["We","are","visiting","the","museum","tomorrow"],a:"We are visiting the museum tomorrow"},
{k:"ord",w:["She","isn't","coming","to","the","party","tonight"],a:"She isn't coming to the party tonight"},
{k:"ord",w:["The","story","was","really","exciting"],a:"The story was really exciting"}]},
{t:"Part 7: Fix the Mistake 🔧",ar:"صححي الخطأ واكتبي الجملة كاملة",c:"var(--lv)",i:[
{k:"fill",q:"He are playing football tonight.",a:["he is playing football tonight","he's playing football tonight"],h:"Check the verb “to be”."},
{k:"fill",q:"The film was very bored.",a:["the film was very boring"],h:"The film causes the feeling."},
{k:"fill",q:"I'm very interesting in science.",a:["i'm very interested in science","i am very interested in science"],h:"I feel interested."}]}
];
var tot=0,got=0,dn=0,api=null;
S.forEach(function(s){tot+=s.i.length});
function $(i){return document.getElementById(i)}
function norm(s){return s.toLowerCase().replace(/[’‘]/g,"'").replace(/[.!?]+$/,"").replace(/\s+/g," ").trim()}
function upd(){$("sc").textContent="⭐ "+got;$("pg").textContent=dn+"/"+tot;$("pf").style.width=(dn/tot*100)+"%"}
function grade(card,ok,msg){card.classList.add(ok?"ok":"no");card.querySelector(".fb").textContent=ok?"✅ Great job!":"❌ "+msg;if(ok)got++;dn++;upd();if(dn===tot)finish()}
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
S.forEach(function(s){
 var sec=el("section");sec.style.background=s.c;sec.appendChild(el("h2",0,s.t));var ar=el("p","ar",s.ar);ar.dir="rtl";sec.appendChild(ar);
 s.i.forEach(function(q){
  var card=el("div","card"),p=el("p","q",q.q||"Build the sentence:");card.appendChild(p);var fb=el("div","fb");
  if(q.k==="mc"){var o=el("div","o");q.o.forEach(function(t,n){var b=el("button",0,t);b.onclick=function(){
    var bs=o.querySelectorAll("button");bs.forEach(function(x){x.disabled=true});
    bs[q.a].classList.add("right");if(n!==q.a)b.classList.add("wrong");
    grade(card,n===q.a,"Correct answer: "+q.o[q.a])};o.appendChild(b)});card.appendChild(o)}
  if(q.k==="fill"){var i=el("input","t");i.setAttribute("aria-label","Your answer");i.placeholder="Type here...";
    var b=el("button","chk","Check ✔");b.onclick=function(){if(card.classList.contains("ok")||card.classList.contains("no")||!i.value.trim())return;
     i.disabled=b.disabled=true;grade(card,q.a.indexOf(norm(i.value))>-1,"Answer: "+q.a[0]+" ("+q.h+")")};
    i.onkeydown=function(e){if(e.key==="Enter")b.click()};card.appendChild(i);card.appendChild(b)}
  if(q.k==="ord"){var ans=el("div","ans"),pool=el("div","pool"),b=el("button","chk","Check ✔"),r=el("button","rst","Start again");
    var ws=q.w.slice().sort(function(){return Math.random()-.5});
    ws.forEach(function(w){var c=el("button","w",w);c.onclick=function(){if(b.disabled)return;(c.parentNode===pool?ans:pool).appendChild(c)};pool.appendChild(c)});
    b.onclick=function(){if(!ans.children.length)return;b.disabled=true;var t=[].map.call(ans.children,function(x){return x.textContent}).join(" ");
     grade(card,norm(t)===norm(q.a),"Correct: "+q.a+".")};
    r.onclick=function(){if(!b.disabled)[].slice.call(ans.children).forEach(function(c){pool.appendChild(c)})};
    card.appendChild(ans);card.appendChild(pool);card.appendChild(b);card.appendChild(r)}
  card.appendChild(fb);sec.appendChild(card)});
 $("m").appendChild(sec)});
function finish(){
 var pct=Math.round(got/tot*100),pass=pct>=60;
 if(api){try{api.LMSSetValue("cmi.core.score.raw",String(pct));api.LMSSetValue("cmi.core.lesson_status",pass?"passed":"failed");api.LMSCommit("")}catch(e){}}
 var r=$("res"),msg=pct>=90?"Superstar! You are amazing! 🌟":pct>=60?"Well done! Keep going! 💪":"Good try! Let's practise again. 🌱";
 r.innerHTML="";r.appendChild(el("div","big",pct>=90?"🏆":pct>=60?"🌸":"🌱"));r.appendChild(el("h2",0,got+" / "+tot+" ("+pct+"%)"));r.appendChild(el("p",0,msg));
 var b=el("button","re","Try again 🔄");b.onclick=function(){location.reload()};r.appendChild(b);r.hidden=false;r.scrollIntoView({behavior:"smooth"});
 for(var n=0;n<22;n++){var e=el("span","rain",["🌸","⭐","🎉","💖","✨"][n%5]);e.style.left=Math.random()*95+"%";e.style.animationDelay=Math.random()*1.2+"s";document.body.appendChild(e)}}
/* SCORM 1.2 */
(function(){var w=window,n=0;while(w&&!w.API&&w.parent&&w.parent!==w&&n<10){w=w.parent;n++}
 api=(w&&w.API)||(window.opener&&window.opener.API)||null;
 if(api){try{api.LMSInitialize("");var st=api.LMSGetValue("cmi.core.lesson_status");
  if(!st||st==="not attempted")api.LMSSetValue("cmi.core.lesson_status","incomplete");
  api.LMSSetValue("cmi.core.score.min","0");api.LMSSetValue("cmi.core.score.max","100");
  var sn=api.LMSGetValue("cmi.core.student_name");if(sn)$("nm").value=sn.split(",").reverse().join(" ").trim()}catch(e){}
  window.addEventListener("beforeunload",function(){try{api.LMSCommit("");api.LMSFinish("")}catch(e){}})}})();
$("dt").value=new Date().toLocaleDateString("en-GB");
upd();
</script></body></html>
